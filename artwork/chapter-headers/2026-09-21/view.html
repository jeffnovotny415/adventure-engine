d').href=files[n-1];const button=document.getElementById('zoom');button.onclick=()=>{const expanded=document.body.classList.toggle('actual');button.setAttribute('aria-pressed',String(expanded));button.textContent=expanded?'Fit to screen':'Actual size';};</script></html>
