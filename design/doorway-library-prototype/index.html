<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paths of Wonder · Doorway prototype</title><style>
*{box-sizing:border-box}body{margin:0;background:#252a29;color:#f6f0e6;font:14px/1.5 system-ui,sans-serif}.review{max-width:1280px;margin:auto;padding:20px 24px}header{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}h1{font:24px Georgia,serif;margin:0}header p{color:#c4c8c4;margin:4px 0 0}label{display:inline-flex;gap:8px;align-items:center}select,button,a{font:inherit;color:inherit}select,button{background:#343b38;border:1px solid #657169;border-radius:8px;min-height:44px;padding:8px 12px}nav{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:18px 0}button[aria-pressed=true]{background:#e8dbbc;color:#332b1f;border-color:#e8dbbc}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid #e6b775;outline-offset:3px}.spacer{flex:1}#stage{position:relative;margin:20px auto 0;width:100%}iframe{border:0;position:absolute;left:50%;top:0;transform-origin:top center;border-radius:16px;box-shadow:0 24px 70px #0005;background:#f5eddc}footer{text-align:center;color:#bbc3bd;margin:22px 0;font-size:13px}a{color:#e8dbbc;text-underline-offset:4px}@media(max-width:600px){.review{padding:14px}header p{max-width:36ch}nav{gap:6px}button,select{padding:8px}.spacer{display:none}}
</style></head><body><div class="review"><header><div><h1>A door into every story.</h1><p>Try a doorway, resume an adventure, or begin again.</p></div><a id="direct" href="library.html">Open full screen ↗</a></header><nav aria-label="Prototype controls"><button data-size="phone" aria-pressed="false">iPhone</button><button data-size="tablet" aria-pressed="true">iPad</button><button id="rotate">Rotate ↻</button><span class="spacer"></span><label>Library <select id="state" aria-label="Library"><option value="saved">Saved adventures</option><option value="fresh">First visit</option></select></label><label><input id="large" type="checkbox"> Larger text</label></nav><div id="stage"><iframe title="Interactive Paths of Wonder library prototype" src="library.html?state=saved"></iframe></div><footer>Design prototype · Sample bookmarks only · Your app and reading progress are unchanged</footer></div><script>
let kind='tablet',portrait=false;const frame=document.querySelector('iframe'),stage=document.querySelector('#stage');
function size(){let [w,h]=kind==='tablet'?[1024,768]:[667,375];if(portrait)[w,h]=kind==='tablet'?[768,1024]:[390,844];const scale=Math.min(1,stage.clientWidth/w);frame.style.width=w+'px';frame.style.height=h+'px';frame.style.transform=`translateX(-50%) scale(${scale})`;stage.style.height=h*scale+'px'}
function update(){const q=`?state=${document.querySelector('#state').value}${document.querySelector('#large').checked?'&large':''}`;frame.src='library.html'+q;document.querySelector('#direct').href='library.html'+q}
for(const b of document.querySelectorAll('[data-size]'))b.onclick=()=>{kind=b.dataset.size;for(const x of document.querySelectorAll('[data-size]'))x.setAttribute('aria-pressed',String(x===b));size()};document.querySelector('#rotate').onclick=()=>{portrait=!portrait;size()};document.querySelector('#state').onchange=update;document.querySelector('#large').onchange=update;new ResizeObserver(size).observe(stage);size();
</script></body></html>
